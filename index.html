{n:"Verified tool calculates",role:"compute"},{n:"Evidence returns, with uncertainty",role:"uncertain"},{n:"Designer inspects, revises, decides",role:"human"}],mf="intention · source or goal · operation · tool and version · assumptions and units · result · uncertainty · designer response",Et=[{n:1,name:"Verified Performance Co-Designer",subtitle:"A human-governed contract between design intent, parametric models and building simulation",branch:"performance contract · early massing · building simulation",closestGenEnv:"MCP parametric modelling; agent-driven public-space design",myEvidence:"all four research projects",chain:[{n:"Designer intent + verified inputs",role:"human"},{n:"LLM / MCP proposal",role:"ai"},{n:"Rhino / Grasshopper state",role:"operation"},{n:"Validated simulation",role:"compute"},{n:"Performance contract",role:"source"},{n:"Preview, commit, rollback",role:"human"}],test:"one parcel and rule family · editable massing · solar or daylight plus energy or carbon",questions:["Can a performance contract detect invalid, stale or inconsistent evidence?","Does it keep intent, geometry, configuration and result consistent across revisions?","Do preview, commit and rollback improve trade-off reasoning and reliance?"],methods:["Benchmark cases with known outcomes","Rule, geometry, unit and stale-evidence tests","Ablations without contract or approval gate","Workflow comparison with designers"],contribution:"A machine-checkable performance contract, a benchmark, and evidence on how it changes design reasoning and reliance"},{n:2,name:"Evidence-Calibrated Climate Co-Designer",subtitle:"Human-AI design of thermally responsive public spaces",branch:"calibrated landscape evidence · microclimate intervention",closestGenEnv:"Digital Thermal Sandbox (LACF; PI Yuhao Lu)",myEvidence:"landscape training, Büyükada, Environmental Massing Agents",chain:[{n:"GIS, weather, measurements",role:"source"},{n:"Calibrated model",role:"compute"},{n:"Parametric landscape",role:"operation"},{n:"Engine or surrogate + uncertainty gate",role:"uncertain"},{n:"AI / MCP alternatives",role:"ai"},{n:"Reversible intervention",role:"human"}],test:"one courtyard, plaza or campus space · a few interventions: canopy, material, shade",questions:["How can measured and simulated evidence become editable interventions without hiding uncertainty?","Can an uncertainty gate decide when to recommend, rerun or defer to the designer?","Does situated evidence beat static heatmaps or optimisation-only tools?"],methods:["Field or reference calibration","Surrogate error and out-of-range tests","Optimisation baseline","Static evidence vs co-designer, with designers"],contribution:"An evidence-calibrated, uncertainty-gated protocol linking microclimate evidence, reversible interventions and human decisions"},{n:3,name:"Embodied Performance Reasoning Studio",subtitle:"Inspecting, challenging and revising AI-supported performance decisions in space",branch:"situated evidence · immersive performance reasoning",closestGenEnv:"rhino-gh-mcp platform",myEvidence:"eCAADe VR study, Unity, HCI studies",twoWay:!0,chain:[{n:"Rhino / Grasshopper state",role:"operation"},{n:"Validated simulation",role:"compute"},{n:"Evidence + uncertainty record",role:"uncertain"},{n:"Unity / VR what-if comparison",role:"source"},{n:"AI explains and proposes",role:"ai"},{n:"Preview, commit, rollback",role:"human"}],test:"one room, courtyard or gallery · one problem only, such as daylight and glare",questions:["Does situated evidence improve diagnosis beyond 2D reports and ordinary VR views?","Do uncertainty and reversible what-ifs help designers reject spatially harmful proposals?","Can geometry, IDs, units and evidence validity stay synchronised across tools?"],methods:["Fidelity, latency and round-trip tests","Ablations without uncertainty or approval","2D report vs desktop 3D vs evidence-aware VR","Diagnosis, correction, reliance, workload"],contribution:"An embodied performance-reasoning protocol that preserves evidence, exposes uncertainty and supports reversible decisions"}],gf=[{name:"Opening",target:"1:10"},{name:"Background",target:"3:30"},{name:"Previous research",target:"2:15"},{name:"Research projects",target:"2:30"},{name:"PhD directions",target:"4:15"},{name:"GenEnv",target:"0:40"},{name:"Conversation",target:"0:25"}],Yl={midWpm:105,transitionSeconds:3},_t=[{id:"title",chapter:"Opening",scene:"opening",layout:"title",kicker:"PhD interview · Generative Environments Lab · UBC SALA · Fall 2027",title:"From environmental evidence to performance-aware co-design",lines:["My work asks how AI can help designers explore built environments without losing the rules, performance evidence, editable geometry and human judgment that make a proposal accountable."],facts:[{label:"Roman Jahandideh",value:"MSc, Interactive Arts and Technology, SFU"},{label:"Today",value:"Previous work and three possible PhD directions"}],media:[{diagram:"atlas-open"}],purpose:"Title, research identity, and the research map with the proposed PhD territory (three possible directions) drawn faintly.",notes:["Thank you for having me. I am Roman Jahandideh, an MSc student in Interactive Arts and Technology at SFU.","My work asks how AI can help designers explore built environments without losing the rules, the performance evidence and the human judgment that make a proposal accountable."]},{id:"question",chapter:"Opening",scene:"phd",layout:"band",kicker:"The question, and the route to it",title:"A proposal is only useful if a designer can check it",lines:["AI can generate convincing spatial proposals. Designers still need the rules, calculations, assumptions and decisions behind them to stay valid as the design changes."],facts:[{label:"GenEnv research program",value:hd,tone:"proposal"}],media:[{diagram:"route",caption:"Each stage, and what it carried forward"}],purpose:"The question and the GenEnv program, then the route from making to human-AI co-design with one capability carried from each stage.",notes:["AI can already produce convincing massing proposals. But a designer can only use one if they can see which rule it followed, how its performance was calculated, and what was assumed.","I will end with three possible directions within GenEnv’s Human-AI Co-Design program. First, the route that led me here."]},{id:"making",chapter:"Background",scene:"trajectory",layout:"cantilever",kicker:"Background · Making",title:"I learn by making",lines:["I build something, test where it works and where it fails, and revise it."],media:[{src:"assets/photos/childhood.jpg",caption:"Already taking things apart",alt:"Roman as a child in a kitchen, opening a drawer to see what is inside."}],purpose:"One childhood photograph and one idea: making as a way of understanding.",notes:["I have always learned by making: as a child I took things apart to see how they worked, and my schooling pushed mathematics and science early. I still build something, test where it fails, and revise it."]},{id:"tabriz",chapter:"Background",scene:"trajectory",layout:"cantilever",kicker:"Background · Spatial form",title:"From making things to designing places",lines:["Architecture let me make new things that change how people live together."],facts:[{label:"Tabriz Art University",value:"Bachelor of Architecture"},{label:"Years",value:"2011 to 2016"}],media:[{src:"assets/photos/tabriz-2.jpg",caption:"Tabriz Art University",credit:"Ashkan najar · CC BY-SA 4.0",alt:"Brick buildings and a blossoming tree on the campus."}],purpose:"Tabriz campus; the degree; why architecture.",notes:["That led me to architecture at Tabriz Art University. Architecture let me make new things with real effects on how people live together. I learned to think about space through form, narrative and social purpose, and tested my work in interschool design competitions."]},{id:"zangar",chapter:"Background",scene:"trajectory",layout:"band",kicker:"Background · Dissertation",title:"Zangar Museum: history translated into space",lines:["A museum about the people of Tabriz under three governments across about a century. Each period became one sharp, angled form."],facts:[{label:"Supervisor",value:"Prof. Parisa Hashempour"},{label:"Recognition",value:"Best Dissertation, 2016",tone:"yellow"}],media:[{src:"assets/portfolio/p019.jpg",caption:"Night view",alt:"Portfolio page: night aerial render of the museum in the city."},{src:"assets/portfolio/p018.jpg",caption:"Three periods, three forms",alt:"Portfolio page: concept text and the three historical periods as three forms."}],purpose:"The night render and the concept board: three periods, three forms.",notes:["My dissertation was the Zangar Museum, about the people of Tabriz under three governments across roughly a century. Each period became one sharp, angled form, so visitors read the history through the building itself.","It was supervised by Prof. Parisa Hashempour and named the best dissertation of my class."]},{id:"zangar-development",chapter:"Background",scene:"trajectory",layout:"gallery",kicker:"Background · Design development",title:"From narrative to plan and section",lines:["Galleries, classrooms, an amphitheater and a library sit inside and between the three forms. The section steps around a green yard."],media:[{src:"assets/portfolio/p023.jpg",caption:"Floor plans",alt:"Portfolio page: floor plans with galleries, depot, parking and amphitheater."},{src:"assets/portfolio/p027.jpg",caption:"Section",alt:"Portfolio page: section through the galleries and green yard."}],purpose:"Plans and section at a readable scale.",notes:["Developing it taught me to carry one idea from a cultural story through geometry, program and circulation, so the plan and section still tell the history."]},{id:"competitions",chapter:"Background",scene:"trajectory",layout:"gallery",kicker:"Background · Competitions",title:"Construction, framing and light",lines:["Competitions let me test how construction, framing and light change the way a space is experienced."],facts:[{label:"Foldable disaster cabin · Memar News national competition, 2018",value:"Sixth prize"},{label:"Landscape design · Tabriz Art University, 2015",value:"Second prize"},{label:"Long-exposure photographs · Abstract Photo of City, 2018",value:"Winner"}],media:[{src:"assets/portfolio/p101.jpg",caption:"Foldable cabin",alt:"Portfolio page: foldable A-frame cabins in a mountain valley."},{src:"assets/portfolio/p105.jpg",caption:"A Tunnel To Heaven",alt:"Portfolio page: winning photograph “A Tunnel To Heaven”."},{src:"assets/portfolio/p106.jpg",caption:"The Ghost of Playground",alt:"Portfolio page: winning photograph “The Ghost of Playground”."}],purpose:"One strip: the foldable cabin and the two winning photographs, with the three results as small facts.",notes:["I kept testing ideas in competitions: a foldable cabin for people displaced by disasters, a landscape design, and long exposures of the city at night. Each was about how construction, framing and light change the way a space is experienced."]},{id:"istanbul",chapter:"Background",scene:"trajectory",layout:"cantilever",kicker:"Background · Environmental systems",title:"From objects to environmental systems",lines:["Architecture taught me to compose space. Landscape architecture taught me that space is also terrain, water, ecology, infrastructure, time and collective use."],facts:[{label:"Istanbul Technical University",value:"Master’s, Landscape Architecture"},{label:"Years",value:"2020 to 2024"}],media:[{src:"assets/photos/tabriz-1.jpg",caption:"Tabriz Art University",credit:"Zahra Multimedia · CC BY-SA 4.0",alt:"A brick tower on the Tabriz Art University campus at sunset."},{src:"assets/photos/itu-2.jpg",caption:"Istanbul Technical University",credit:"CeeGee · CC BY-SA 3.0",alt:"The Taşkışla building of Istanbul Technical University."}],purpose:"Tabriz and Istanbul side by side: the move from composing objects to reading systems.",notes:["Over time I felt my architecture paid too little attention to society and nature, so I studied landscape architecture at Istanbul Technical University. Landscape taught me that space is also terrain, water, ecology and time. At ITU I also started using GIS."]},{id:"buyukada",chapter:"Background",scene:"trajectory",layout:"band",kicker:"Background · Büyükada",title:"A water system, not an object",lines:["On a steep island, the design began from slope, roads and runoff, and became connected interventions linked down the hill to shared storage."],media:[{src:"assets/portfolio/p109.jpg",caption:"Slope and roads",alt:"Portfolio page: topography analysis and existing roads."},{src:"assets/portfolio/p117.jpg",caption:"Where the water goes",alt:"Portfolio page: section with water harvesting pools and terraces."},{src:"assets/portfolio/p122.jpg",caption:"Two connected units",alt:"Portfolio page: two housing units with rain gardens and storage tanks."}],purpose:"Analysis, water section and connected units: from site reading to a connected system.",notes:["On Büyükada, a steep island, rainwater runs straight down the streets. The design began from slope, roads and runoff, and became a system of collectors, cisterns and planted basins linked down the hill to shared storage. Design became a network of relationships I could represent and measure."]},{id:"generative-images",chapter:"Background",scene:"trajectory",layout:"gallery",kicker:"Background · Generative images, 2022",title:"First experiments with generative AI",lines:["I used Midjourney to explore landscapes and atmospheres from text prompts. The images came quickly and looked convincing, but none carried a scale, a site or evidence a designer could check."],facts:[{label:"Tool",value:"Midjourney"},{label:"Period",value:"August to September 2022"}],media:[{src:"assets/photos/mj-jar.jpg",caption:"A landscape in a glass jar",alt:"Midjourney image by Roman: a miniature landscape with towers and trees inside a glass jar."},{src:"assets/photos/mj-rails.jpg",caption:"Mist, moon and rails",alt:"Midjourney image by Roman: a train on overgrown rails in a misty landscape under a full moon."},{src:"assets/photos/mj-roots.jpg",caption:"Roots as space",alt:"Midjourney image by Roman: a hall whose floor and vaults are made of tangled roots."}],purpose:"Three of Roman’s own Midjourney images from 2022: an exploratory use of generative AI for landscape and atmosphere, and the limit it exposed.",notes:["During my master’s in Istanbul I also experimented with Midjourney, generating landscapes and atmospheres from text prompts. It was exciting how fast the images came, but they had no scale, no site and nothing I could verify. That limit is part of why I now study AI that stays connected to evidence."]},{id:"ecaade",chapter:"Previous research",scene:"foundation",layout:"figure-left",kicker:"Toward better VR design tools",title:"Designing depth in virtual landscapes",lines:["I tested how colour and transparency change perceived depth in VR. At high transparency, cool and dark colours looked nearer, reversing the usual cue: how space is represented changes how it is judged."],callout:{label:"For a designer’s toolset",text:"These findings could become guidance inside a VR design tool, suggesting colour and transparency so a landscape reads at the depth the designer intends."},facts:[{label:"Participants",value:"60"},{label:"Judgments each",value:"264"},{label:"Education and Research in Computer Aided Architectural Design in Europe",value:"eCAADe 41, Graz, 2023 · published",tone:"cyan"}],caveat:"One white background, six hues, four transparency levels. Results may differ in other scenes.",links:[{label:"DOI",url:"https://doi.org/10.52842/conf.ecaade.2023.1.149"}],media:[{diagram:"spheres",caption:"Four transparency levels"},{diagram:"colours",caption:"Twelve colour conditions"}],purpose:"Study design redrawn as vectors: four transparency levels, twelve colour conditions.",notes:["In the Virtual Landscape Lab with Dr. Ikhwan Kim, I studied a problem designers face in VR: depth does not always read as intended. Sixty people each made 264 depth judgments. At high transparency the usual rule reversed. The finding is bounded, but it could guide colour and transparency in a VR design tool."]},{id:"build-and-study",chapter:"Previous research",scene:"trajectory",layout:"band",kicker:"Previous research · SFU, iViz Lab",title:"Learning how AI systems are built and run",lines:["To use AI in design responsibly, I needed to understand how AI systems are built and run, not only how to prompt them. That led me to SFU and the iViz Lab, which works on AI, while I kept building architectural systems and prototypes."],facts:[{label:"Degree",value:"MSc, Interactive Arts and Technology"},{label:"Teaching assistant",value:"IAT 313 · IAT 343 · IAT 102"}],media:[{diagram:"capability",caption:"One question, carried end to end"},{src:"assets/photos/sfu-2.jpg",caption:"SFU Surrey",credit:"Canmenwalker · CC BY 4.0",alt:"The multi-storey atrium of the Simon Fraser University Surrey campus, with a timber roof structure."},{src:"assets/photos/teach-iat343.jpg",caption:"Teaching Maya · IAT 343",alt:"Roman teaching 3D modeling in Maya in front of a projected screen."}],purpose:"Why SFU: learning how AI systems are built and run. Capability chain from question to publication, the SFU Surrey atrium and one teaching photo.",notes:["Midjourney showed me what AI could produce, but not how it works. To use AI responsibly in design, I needed to learn how these systems are built and run. That led me to SFU and Prof. Steve DiPaola’s iViz Lab, which works on AI. Alongside the lab, I kept building small architectural systems and prototypes.","There I learned to carry a question the whole way: a prototype in Unity and C#, a data pipeline in Python and JavaScript, then the study and the paper. I also teach as a TA in three SIAT courses, and last week ran a Unity workshop."]},{id:"hci",chapter:"Previous research",scene:"foundation",layout:"figure",kicker:"Previous research · HCI studies",title:"How a representation shapes trust",lines:["A teammate’s heart rate shown as a halo was read above chance, and teams helped each other faster. People still trusted plain numbers more."],facts:[{label:"Halo states recognised (chance 25%)",value:"66.3%"},{label:"Faster help",value:"3.90 s",tone:"cyan"},{label:"ACM International Conference on Interactive Surfaces and Spaces",value:"ISS 2026, Turin · accepted"},{label:"BioTerrarium",value:"Under revision",tone:"orange"}],caveat:"The ISS DOI activates with the proceedings, 23 to 26 November 2026. BioTerrarium results are provisional.",media:[{src:"assets/papers/iss-halos.jpg",caption:"ISS · 16 halo states",alt:"Sixteen halo icons combining heart rate and heart rate variability."},{src:"assets/papers/bio-zones.jpg",caption:"BioTerrarium · four body states",alt:"Four terrarium scenes from calm to overdrive."}],purpose:"Halo states and BioTerrarium zones; the trust trade-off as the headline, statuses kept small.",notes:["In one study, a remote teammate’s heart rate appeared as a halo instead of numbers. People read it above chance and helped faster, but trusted the numbers more. BioTerrarium is still under revision.","These studies taught me to build a complete research system and examine how people understand, trust and use it. I now want to bring that back into architecture and landscape design, where AI recommendations must stay connected to real performance evidence."]},{id:"division",chapter:"Research projects",scene:"synthesis",layout:"band",kicker:"Research projects",title:"AI interprets and proposes. Verified code computes. The designer judges.",lines:["Several small research projects, each exploring one part of the same problem: regulation, editable geometry, a spatial constraint and performance critique."],media:[{diagram:"roles",caption:"Who does what in each project"}],purpose:"Matrix of the three roles (AI, verified code, designer) across the four projects, each role with its own line style.",notes:["Then I began several small research projects on parts of one problem: how rules become spatial knowledge, how that becomes editable geometry, how constraints are calculated, and how AI might support performance critique. In each, AI proposes, code computes, and the designer judges."]},{id:"zla",chapter:"Research projects",scene:"zla",layout:"figure-left",kicker:"Project 1 · Regulation",title:"Zoning Literacy Assistant",project:{problem:"Can an assistant answer zoning questions only from cited clauses, and say when the bylaw is silent?",built:"Retrieval of the relevant clauses, an answer limited to them, then a check.",evidence:"Asked about laneway storeys, it says “not covered” and stops. Site area is computed in code: 162.6 m².",limit:"Ten clauses of Vancouver’s R1-1 zone. Not planning advice.",lesson:"Urban knowledge must keep its sources, uncertainty and non-answers."},links:[{label:"Live system",url:"https://romanjahandideh.github.io/zoning-literacy-assistant/"},{label:"GitHub",url:"https://github.com/RomanJahandideh/zoning-literacy-assistant"}],media:[{diagram:"notcovered",caption:"Silence is reported, not guessed"}],purpose:"The retrieve, answer, verify pipeline stopping at “not covered”.",notes:["First, regulation. I explored whether an assistant could answer zoning questions only from cited clauses. Asked how many storeys a laneway house may have, it says the source does not cover it, and stops. It uses ten clauses of one zone. The lesson: urban knowledge has to keep its sources and its non-answers."]},{id:"pmg",chapter:"Research projects",scene:"pmg",layout:"figure",kicker:"Project 2 · Editable geometry",title:"Parametric Massing Generator",project:{problem:"Can rules read by AI stay editable once they become geometry?",built:"AI extracts eight rules with their source phrases; code builds the envelope.",evidence:"Change one value, the rental condition, and every dependent part updates: FSR 0.70 to 1.00.",limit:"A research prototype, not code-compliance software.",lesson:"AI output should be symbolic and editable, not a finished model."},links:[{label:"Live system",url:"https://romanjahandideh.github.io/parametric-massing-generator/"},{label:"GitHub",url:"https://github.com/RomanJahandideh/parametric-massing-generator"}],media:[{diagram:"envelope",caption:"Envelope from extracted rules"},{src:"assets/projects/pmg-hero.webp",caption:"Live system, captured",alt:"Massing volumes on an urban block with a plan inset."}],purpose:"Rules becoming an editable envelope, plus a captured interface state.",notes:["Second, geometry. Here the AI extracts eight rules from the bylaw, each with its source sentence, and code builds the envelope. Change one value, like the rental condition, and everything that depends on it updates. It is a research prototype, not compliance software. The lesson: AI output should stay editable."]},{id:"vcm",chapter:"Research projects",scene:"vcm",layout:"figure-left",kicker:"Project 3 · Spatial constraint",title:"Vancouver View Corridor Massing",project:{problem:"How much does a flat-cap shortcut misstate a sloped view limit?",built:"Floor-by-floor clipping against the City’s corridor geometry, exported to Rhino .3dm.",evidence:"18 floors instead of 10, and 39.5% more floor area, in the documented test case.",limit:"Base elevation and slope are placeholders. The Grasshopper step is written, not executed.",lesson:"Methods and assumptions must travel with the result."},links:[{label:"GitHub",url:"https://github.com/RomanJahandideh/vancouver-view-corridor-massing"}],media:[{diagram:"corridor",caption:"Flat cap against floor-by-floor trim"}],purpose:"Section: the sloped view ceiling, the flat cap, then floor-by-floor trimming with live counts.",notes:["Third, a spatial constraint. Protected views in Vancouver are sloped, but quick checks use a flat cap. Clipping floor by floor against the City’s corridor data gives eighteen floors instead of ten. But the base elevation and slope are placeholders, so the number only means something with its assumptions attached."]},{id:"ema",chapter:"Research projects",scene:"ema",layout:"figure",kicker:"Project 4 · Performance critique",title:"Environmental Massing Agents",project:{problem:"Do agent critics make performance search better?",built:"Generator, critic and orchestrator agents over deterministic evaluators.",evidence:"Guided search was more reliable, not faster.",limit:"Simplified solar, benchmark carbon, a wind proxy. Live LLM loop not run.",lesson:"More agents are not better design. Test autonomy and verification."},facts:[{label:"Faster search",value:"Not confirmed",tone:"red"},{label:"Runs reaching the target",value:"4/5 vs 1/5",tone:"cyan"}],links:[{label:"GitHub",url:"https://github.com/RomanJahandideh/environmental-massing-agents"}],media:[{diagram:"agents",caption:"Agents argue, code scores"},{diagram:"seeds",caption:"Two searches"}],purpose:"Agent roles around one evaluator box; search runs against the target, with “not faster” in red.",notes:["Fourth, performance critique. Agents propose and critique; deterministic evaluators score. I expected guided search to be faster. It was not, but it was more reliable: four of five runs against one of five. The models are simplified and the live language-model loop has not run. More agents do not automatically give better design."]},{id:"state-of-art",chapter:"PhD directions",scene:"stateofart",layout:"band",kicker:"State of the art → open research problem",title:"What already exists—and the missing link",lines:["Existing systems can translate language into parametric operations, run performance analyses, and connect design models across tools. The remaining challenge is keeping the resulting evidence valid, traceable, and open to designer challenge as the model continues to change."],media:[{diagram:"soa",caption:"Selected representative work, 2016 to 2026; Xun Liu, GenEnv and UBC work in yellow"}],purpose:"Selected existing capabilities with references, attributed Xun Liu, GenEnv and UBC work highlighted in yellow (starting with the earlier XL Studio environmental-feedback work), then a cautiously worded open research problem scoped to the systems reviewed.",notes:["Before defining a direction, I reviewed recent work across computational design, building simulation and human–AI co-design. There is already strong research connecting language models to Grasshopper, generating CAD, running simulations and bringing parametric models into VR.","Reading the earlier XL Studio projects helped me see a longer trajectory in your work. FluX and The Third Simulation brought environmental processes into interactive design feedback; ECO GEN connected ecological data with generative design; and Archi-Agent connected natural-language intent with parametric operations. My proposed directions build on that trajectory by asking how performance evidence, uncertainty and design changes can remain traceable and under the designer’s control.","Across the systems I reviewed, however, I did not find one continuous, human-governed workflow that keeps performance evidence valid and traceable as geometry, assumptions and tool states change. That is the shared problem behind the three directions I will show next."]},{id:"principle",chapter:"PhD directions",scene:"phd",layout:"band",kicker:"Shared principle",title:"AI interprets and co-ordinates. Verified tools calculate. Designers inspect, revise and decide.",lines:["Performance provenance is the supporting record behind each change, not the whole dissertation."],media:[{diagram:"loop",caption:"The loop all three directions share"}],purpose:"The six-step loop with role colours and shapes, and the provenance record beneath it.",notes:["All three directions share one principle. The designer states an intention, AI interprets and co-ordinates, the parametric model changes, a verified tool calculates, and the evidence returns with its uncertainty so the designer can decide.","Each change keeps a record: the source, the operation, the tool, the assumptions, the result and the decision."]},{id:"directions",chapter:"PhD directions",scene:"phd",layout:"band",kicker:"Three possible directions",title:"One program, three possible directions",lines:["Three possible prototype-driven ways of contributing to the same funded program. I would value your guidance on which problem and tool chain would be most useful."],media:[{diagram:"branches",caption:"Each branch would be one dissertation, not all three"}],purpose:"The NSERC program as the root, branching to three direction nodes, each with its closest GenEnv work and Roman’s own evidence.",notes:["From there I see three possible directions within the Human-AI Co-Design program. Each would build a working prototype with verified tools and a study with designers. I would not combine all three; I would value your view on which one is most useful."]},{id:"direction-1",chapter:"PhD directions",scene:"phd",layout:"band",kicker:"Possible direction 1 · early urban massing",title:Et[0].name,lines:[Et[0].subtitle+".","Performance evidence becomes unreliable when geometry, assumptions or simulation state change. Can a human-AI workflow keep it valid, inspectable and reversible?"],media:[{diagram:"dir1",caption:"Prototype tool chain, questions, methods, contribution"}],purpose:"Direction 1: tool chain from intent to rollback, bounded test, three questions, methods, contribution.",notes:["The first is a Verified Performance Co-Designer for early urban massing. Connecting AI to Grasshopper or a simulator already exists. The open issue is keeping evidence valid while the model changes.","I would build a performance contract that links each proposal to its geometry, assumptions, tool configuration, units and result, and marks evidence stale when a dependency changes. I would benchmark it and study whether it improves error detection, trade-off reasoning and appropriate reliance."]},{id:"direction-2",chapter:"PhD directions",scene:"phd",layout:"band",kicker:"Possible direction 2 · public space",title:Et[1].name,lines:[Et[1].subtitle+".","Trees, materials, shade and circulation are design decisions, but measured and simulated microclimate evidence sits in separate specialist tools."],caveat:"Field data, sensors and the final simulation engine are subject to lab confirmation.",media:[{diagram:"dir2",caption:"Prototype tool chain, questions, methods, contribution"}],purpose:"Direction 2: tool chain from site evidence to reversible intervention with an uncertainty gate; bounded test; questions; methods; contribution.",notes:["The second is closest to my landscape training. Thermal maps and tree optimisation already exist, so I would focus on the link between field evidence, simulation, uncertainty and reversible design action.","If a fast surrogate is used, it would show its uncertainty and send doubtful cases back to the full model or the designer. I would test whether this improves diagnosis and intervention quality compared with static reports."]},{id:"direction-3",chapter:"PhD directions",scene:"phd",layout:"band",kicker:"Possible direction 3 · embodied evidence",title:Et[2].name,lines:[Et[2].subtitle+".","Can situated, uncertainty-aware what-if evidence help designers diagnose problems and challenge AI proposals, beyond reports or ordinary VR?"],media:[{diagram:"dir3",caption:"Prototype tool chain, questions, methods, contribution"}],purpose:"Direction 3: two-way tool chain between Rhino, simulation, evidence record and Unity/VR; bounded test; questions; methods; contribution.",notes:["The third builds on my VR and HCI work. Grasshopper and VR are already connected in recent work, so the bridge is not the contribution.","I would study how designers inspect the evidence behind an AI proposal from inside the space, compare reversible what-ifs, see stale or uncertain results, and approve or reject a change. The question is whether this helps them resist proposals that raise a number but weaken the space."]},{id:"genenv",chapter:"GenEnv",scene:"genenv",layout:"band",kicker:"Why GenEnv",title:"Where my path meets GenEnv",lines:["My background has taken me from spatial design and environmental systems to HCI and AI-assisted design. GenEnv is where these strands can become one rigorous research direction."],media:[{diagram:"confluence",caption:"What I start with, the shared question, what I hope to develop"}],purpose:"Convergence: starting point (design and systems; interactive systems and projects) into the shared question, then what Roman needs GenEnv to develop; the three directions as a small note.",notes:["I come with design judgment from architecture and landscape, GIS and systems thinking, interactive systems and HCI studies, and early research projects. What I need GenEnv for is deeper Rhino, Grasshopper and MCP integration, validated simulation, co-design theory and professional verification, so that one of these directions becomes a focused doctoral system."]},{id:"conversation",chapter:"Conversation",scene:"conversation",layout:"questions",title:"Thank you",lines:["I would value your guidance on where to begin."],links:[{label:"romanjahandideh.com",url:"https://romanjahandideh.com"},{label:"github.com/RomanJahandideh",url:"https://github.com/RomanJahandideh"}],questions:["Would a performance-contract infrastructure, a calibrated landscape case or an embodied reasoning interface contribute most to the program?","Which performance tools, datasets and design cases are already available or planned within GenEnv?","Which first contribution would be most valuable to the lab: the benchmark and protocol, a validated domain prototype, or the human-AI study?"],media:[{diagram:"atlas-full"}],purpose:"Three questions beside the resolved research map.",notes:["Thank you. Three questions. Which of the three would contribute most to the program? Which tools, datasets and design cases does the lab already have? And which first contribution would be most valuable: the protoc
